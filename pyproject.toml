[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydatcom"
version = "0.1.0"
description = "Python implementation of USAF Digital DATCOM aerodynamic analysis tool"
readme = "pydatcom/README.md"
license = { text = "Public Domain" }
requires-python = ">=3.8"
authors = [{ name = "Converted from USAF Digital DATCOM" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
    "License :: Public Domain",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19.0",
    "pyyaml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
]
plots = [
    "matplotlib>=3.3.0",
]
analysis = [
    "pandas>=1.1.0",
]

[project.scripts]
pydatcom = "pydatcom.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pydatcom"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pydatcom*"]

[tool.setuptools.package-data]
pydatcom = [
    "config/*.yaml",
    "data/tables/*.yaml",
    "data/tables/*.json",
]
